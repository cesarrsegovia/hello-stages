services:
  app-dev:
    build:
      context: .
      target: development
    env_file:
      - ./env/dev.env
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    profiles: ["dev"]

  app-test:
    build:
      context: .
      target: test
    env_file:
      - ./env/test.env
    profiles: ["test"]

  app-prod:
    build:
      context: .
      target: production
    env_file:
      - ./env/prod.env
    ports:
      - "8080:3000"
    restart: unless-stopped
    profiles: ["prod"]
